[package]
name = "zekurix-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.5", features = ["derive"] }
figment = { version = "0.10.19", features = ["env", "toml"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["macros", "postgres", "runtime-tokio"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5.3", features = ["timeout"] }
tower-http = { version = "0.7.0", features = ["timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.24.0", features = ["v7", "serde"] }

[dev-dependencies]
assert_cmd = "2.2.2"
http-body-util = "0.1.4"
predicates = "3.1.4"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
