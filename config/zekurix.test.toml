# ------------------------------------------------------------------------------
# Test configuration
#
# This file contains settings used by automated tests.
#
# For a complete description of all available settings, refer to
# `config/zekurix.example.toml`.
# ------------------------------------------------------------------------------

[logging]
level = "debug"
format = "full"

[database]
username = "postgres"
# Dedicated database used by automated tests.
database = "zekurix_test"
# Automatically apply database migrations before running tests.
migrate = true

[authentication]
# Trusted JWT issuers expected by automated tests.
issuers = [
    "https://auth.example.com/my-issuer"
]
# JWT audience expected by automated tests.
audience = "zekurix"

[authentication.provider]
# Path to the JWKS file used by automated tests.
jwks_file = "tests/keys/authentication/jwks.json"
