name: OpenAPI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate OpenAPI bundle
        run: python3 openapi/scripts/build_openapi.py lint
 
  bundle:
    name: OpenAPI bundle verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate OpenAPI bundle
        run: python3 openapi/scripts/build_openapi.py build

      - name: Verify generated artifacts are up to date
        run: git diff --exit-code -- openapi/generated/
 
  schematesis:
    name: Run Schematesis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs:
      - lint
      - bundle

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start services
        run: docker compose --profile full up --build -d --wait

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install Schemathesis
        run: uv tool install schemathesis

      - name: Run Schemathesis
        run: |
          schemathesis run \
            --phases examples,coverage,fuzzing \
            --report junit \
            http://localhost:3000/openapi.json

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: schemathesis-results
          path: schemathesis-report/

      - name: Cleanup
        if: always()
        run: docker compose --profile full down -v --remove-orphans

  schematesis-stateful:
    name: Run stateful Schematesis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs:
      - lint
      - bundle

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start services
        run: docker compose --profile full up --build -d --wait

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install Schemathesis
        run: uv tool install schemathesis

      - name: Run Schemathesis
        run: |
          schemathesis run \
            --phases stateful \
            --max-examples 25 \
            --report junit \
            http://localhost:3000/openapi.json

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: schemathesis-stateful-results
          path: schemathesis-report/

      - name: Cleanup
        if: always()
        run: docker compose --profile full down -v --remove-orphans

