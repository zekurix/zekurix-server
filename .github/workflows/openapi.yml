name: OpenAPI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate OpenAPI bundle
        run: python3 openapi/scripts/build_openapi.py lint
 
  bundle:
    name: OpenAPI bundle verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate OpenAPI bundle
        run: python3 openapi/scripts/build_openapi.py build

      - name: Verify generated artifacts are up to date
        run: git diff --exit-code -- openapi/generated/
 
  schematesis:
    name: Run Schematesis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs:
      - lint
      - bundle

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create environment file
        run: |
          cat > .env <<EOF
          ZEKURIX_DATABASE__PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'postgres' }}
          ZEKURIX_AUTHENTICATION__AUDIENCE=zekurix
          EOF

      - name: Start services
        run: docker compose --profile full up --build -d --wait

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install Schemathesis
        run: uv tool install schemathesis

      - name: Get admin token
        id: auth
        run: |
          TOKEN=$(curl --fail --silent \
            http://localhost:3001/my-issuer/token \
            -d 'grant_type=client_credentials' \
            -d 'client_id=zekurix-schemathesis' \
            -d 'client_secret=zekurix-schemathesis-secret' \
            -d 'username=admin' \
            | jq -r '.access_token')
          test -n "$TOKEN"
          test "$TOKEN" != "null"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run Schemathesis
        run: |
          schemathesis run \
            --phases examples,coverage,fuzzing \
            --report junit \
            --header "Authorization: Bearer $AUTH_TOKEN" \
            http://localhost:3000/openapi.json
        env:
          AUTH_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: schemathesis-results
          path: schemathesis-report/

      - name: Dump logs
        if: always()
        run: docker compose --profile full logs --no-color

      - name: Cleanup
        if: always()
        run: docker compose --profile full down -v --remove-orphans

  schematesis-stateful:
    name: Run stateful Schematesis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs:
      - lint
      - bundle

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create environment file
        run: |
          cat > .env <<EOF
          ZEKURIX_DATABASE__PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'postgres' }}
          ZEKURIX_AUTHENTICATION__AUDIENCE=zekurix
          EOF

      - name: Start services
        run: docker compose --profile full up --build -d --wait

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install Schemathesis
        run: uv tool install schemathesis

      - name: Get admin token
        id: auth
        run: |
          TOKEN=$(curl --fail --silent \
            http://localhost:3001/my-issuer/token \
            -d 'grant_type=client_credentials' \
            -d 'client_id=zekurix-schemathesis' \
            -d 'client_secret=zekurix-schemathesis-secret' \
            -d 'username=admin' \
            | jq -r '.access_token')
          test -n "$TOKEN"
          test "$TOKEN" != "null"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run Schemathesis
        run: |
          schemathesis run \
            --phases stateful \
            --max-examples 25 \
            --report junit \
            --header "Authorization: Bearer $AUTH_TOKEN" \
            http://localhost:3000/openapi.json
        env:
          AUTH_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: schemathesis-stateful-results
          path: schemathesis-report/

      - name: Dump logs
        if: always()
        run: docker compose --profile full logs --no-color

      - name: Cleanup
        if: always()
        run: docker compose --profile full down -v --remove-orphans
