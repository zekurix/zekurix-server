name: Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and test Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Debug container crash (capture logs before --rm removes it)
        run: |
          echo "=== Container Crash Investigation ==="
    
          # Démarrer le conteneur sans --rm pour pouvoir inspecter après
          docker run --detach \
            --name zekurix-debug \
            -p 3000:3000 \
            "${IMAGE_NAME}":test
    
          echo "Waiting 15 seconds for potential crash..."
          sleep 15
    
          # Capturer TOUS les détails AVANT suppression
          echo "=== Container Status ==="
          docker ps -a | grep zekurix-debug || echo "Container no longer exists"
    
          echo "=== Exit Code ==="
          docker inspect zekurix-debug --format '{{.State.ExitCode}}' 2>/dev/null || echo "Cannot inspect"
    
          echo "=== Container Logs ==="
          docker logs zekurix-debug 2>&1 || echo "No logs available"
    
          echo "=== Health Status ==="
          docker inspect zekurix-debug --format '{{.State.Health.Status}}' 2>/dev/null || echo "No health status"
    
          echo "=== Process Info ==="
          docker inspect zekurix-debug --format '{{json .State.Process}}' 2>/dev/null || echo "No process info"
    
          echo "=== Kill & Cleanup ==="
          docker stop zekurix-debug 2>/dev/null || true
          docker rm zekurix-debug 2>/dev/null || true
    
          echo "=== Debug Complete ==="
          exit 0  # Ne fait pas échouer le CI - juste informative

      - name: Test image runs
        run: |
          set -euo pipefail

          docker run --rm --detach \
            --name zekurix-test \
            -p 3000:3000 \
            ${IMAGE_NAME}:test

          sleep 10

          if ! docker ps | grep -q zekurix-test; then
            echo "Container failed to start"
            docker logs zekurix-test || true
            docker stop zekurix-test || true
            exit 1
          fi

          echo "Container is running"
          docker logs zekurix-test
          docker stop zekurix-test

      - name: Test healthcheck
        run: |
          set -euo pipefail

          docker run --rm --detach \
            --name zekurix-health \
            -p 3001:3000 \
            ${IMAGE_NAME}:test

          echo "Waiting for healthcheck..."
          for i in {1..30}; do
            health_status=$(docker inspect -f '{{.State.Health.Status}}' zekurix-health 2>/dev/null)         
            if [ "$health_status" = "healthy" ]; then
              echo "Healthcheck passed"
              docker stop zekurix-health
              exit 0
            fi
            sleep 1
          done
          
          echo "Healthcheck failed after 30 attempts"
          docker logs zekurix-health || true
          docker inspect zekurix-health --format '{{json .State.Health}}' || true
          docker stop zekurix-health || true
          exit 1

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${IMAGE_NAME}:test
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: always()
        with:
          sarif_file: trivy-results.sarif
