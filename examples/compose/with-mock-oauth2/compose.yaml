services:
  postgres:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: ${ZEKURIX_DATABASE__USERNAME:-postgres}
      POSTGRES_PASSWORD: ${ZEKURIX_DATABASE__PASSWORD?required}
      POSTGRES_DB: ${ZEKURIX_DATABASE__DATABASE:-zekurix}
    expose:
      - ${ZEKURIX_DATABASE__PORT:-5432}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - ${ZEKURIX_DATABASE__USERNAME:-postgres}
        - -d
        - ${ZEKURIX_DATABASE__DATABASE:-zekurix}
      interval: 2s
      timeout: 5s
      retries: 10

  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.3@sha256:95159e47ce682b41841e2671c36ebfa509d82b62c8b8fb4f18b772ccea3e404d
    restart: always
    ports:
      - 3001:8080
    environment:
      JSON_CONFIG: >-
        {
          "tokenCallbacks": [
            {
              "issuerId": "my-issuer",
              "requestMappings": [
                {
                  "requestParam": "username",
                  "match": "*",
                  "claims": {
                    "aud": ["${ZEKURIX_AUTHENTICATION__AUDIENCE?required}"],
                    "sub": "$${username}"
                  }
                }
              ]
            }
          ]
        }
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://localhost:8080/my-issuer/jwks
      interval: 2s
      timeout: 5s
      retries: 10

  zekurix:
    image: zekurix/zekurix-server:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      mock-oauth2-server:
        condition: service_healthy
    ports:
      - ${ZEKURIX_SERVER__PORT:-3000}:${ZEKURIX_SERVER__PORT:-3000}
    env_file:
      - .env
    environment:
      ZEKURIX_DATABASE__HOST: postgres
    volumes:
      - ./zekurix.toml:/etc/zekurix/zekurix.toml:ro

volumes:
  postgres-data:
