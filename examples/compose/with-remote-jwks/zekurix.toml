# ------------------------------------------------------------------------------
# Example configuration file for Zekurix Server.
#
# This file is loaded by Zekurix Server at startup.
#
# Only a subset of the available settings is shown here. Refer to the project
# documentation for the complete configuration reference.
#
# Review and adjust the values to match your environment before deploying
# to production.
# ------------------------------------------------------------------------------

[database]
# Enables automatic database migrations at startup.
migrate = true

[authentication]
# JWT issuer used for token validation.
issuer = "https://auth.example.com/my-issuer"

# JWT audience used for token validation.
audience = "zekurix"

[authentication.provider]
# Retrieve JWKS from the external identity provider.
jwks_url = "https://auth.example.com/my-issuer/jwks"
