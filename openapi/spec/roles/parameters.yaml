components:
  parameters:
    RoleId:
      name: id
      in: path
      description: Unique identifier of the role.
      required: true
      schema:
        $ref: "./schemas.yaml#/components/schemas/RoleId"

    RoleIdPath:
      name: role_id
      in: path
      description: Unique identifier of the role.
      required: true
      schema:
        $ref: "./schemas.yaml#/components/schemas/RoleId"

    RoleNameFilter:
      name: name
      in: query
      description: Filter roles by exact role name.
      required: false
      schema:
        $ref: "./schemas.yaml#/components/schemas/RoleName"
