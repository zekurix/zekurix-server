components:
  responses:
    RoleNotFound:
      description: Role not found.
      headers:
        X-Request-Id:
          $ref: "./../common/headers.yaml#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "./../common/schemas.yaml#/components/schemas/ErrorResponse"
 
    RoleConflict:
      description: Another role with this name already exists.
      headers:
        X-Request-Id:
          $ref: "./../common/headers.yaml#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "./../common/schemas.yaml#/components/schemas/ErrorResponse"
