components:
  schemas:
    UserId:
      description: Unique identifier of a user.
      type: string
      format: uuid
      example: 01a05d6f-ca97-7801-8c05-097d2e1c727a

    Username:
      description: Username containing 3 to 64 ASCII alphanumeric characters, underscores, or hyphens.
      type: string
      minLength: 3
      maxLength: 64
      pattern: ^[A-Za-z0-9_-]+$
      example: Alice-123

    CreateUserRequest:
      description: Request payload for creating a user.
      type: object
      additionalProperties: false
      required:
        - username
      properties:
        username:
          $ref: "#/components/schemas/Username"

    UserResponse:
      description: Response containing user details.
      type: object
      additionalProperties: false
      required:
        - id
        - username
      properties:
        id:
          $ref: "#/components/schemas/UserId"
        username:
          $ref: "#/components/schemas/Username"
