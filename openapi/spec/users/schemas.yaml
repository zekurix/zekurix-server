components:
  schemas:
    UserId:
      description: Unique identifier of a user.
      type: string
      format: uuid
      example: 01a05d6f-ca97-7801-8c05-097d2e1c727a

    Identity:
      description: External identity uniquely identifying a user.
      type: object
      additionalProperties: false
      required:
        - issuer
        - subject
      properties:
        issuer:
          description: Identity provider issuer.
          type: string
          minLength: 1
          maxLength: 1024
          pattern: ^[^\u0000]*$
          example: https://auth.example.com
        subject:
          description: Identity provider subject identifier.
          type: string
          minLength: 1
          maxLength: 1024
          pattern: ^[^\u0000]*$
          example: Alice

    CreateUserRequest:
      description: Request payload for creating a user.
      type: object
      additionalProperties: false
      required:
        - identity
      properties:
        identity:
          $ref: "#/components/schemas/Identity"

    UserResponse:
      description: Response containing user details.
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          $ref: "#/components/schemas/UserId"
