paths:
  /users:
    post:
      security: []
      tags:
        - users
      summary: Create a new user.
      description: Creates a user and returns the created user details.
      operationId: createUser

      requestBody:
        description: User creation request payload.
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/components/schemas/CreateUserRequest"
        required: true

      responses:
        "201":
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: "./schemas.yaml#/components/schemas/UserResponse"
        "409":
          description: A user with this username already exists.
          content:
            application/json:
              schema:
                $ref: "./../common/schemas.yaml#/components/schemas/ErrorResponse"
        "422":
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: "./../common/schemas.yaml#/components/schemas/ErrorResponse"
        "500":
          $ref: "./../common/responses.yaml#/components/responses/InternalServerError"

  /users/{id}:
    get:
      security: []
      tags:
        - users
      summary: Retrieve a user by ID.
      description: Returns the details of the specified user.
      operationId: getUser

      parameters:
        - $ref: "./parameters.yaml#/components/parameters/UserId"

      responses:
        "200":
          description: User retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "./schemas.yaml#/components/schemas/UserResponse"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "./../common/schemas.yaml#/components/schemas/ErrorResponse"
        "500":
          $ref: "./../common/responses.yaml#/components/responses/InternalServerError"
