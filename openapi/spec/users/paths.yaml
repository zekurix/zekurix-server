paths:
  /users:
    post:
      security: []
      tags:
        - users
      summary: Create a new user.
      description: Creates a user and returns the created user details.
      operationId: createUser

      parameters:
        - $ref: "./../common/parameters.yaml#/components/parameters/X-Request-Id"

      requestBody:
        description: User creation request payload.
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/components/schemas/CreateUserRequest"
        required: true

      responses:
        "201":
          description: User created successfully.
          headers:
            X-Request-Id:
              $ref: "./../common/headers.yaml#/components/headers/X-Request-Id"
            Location:
              description: URI of the created user resource.
              schema:
                type: string
                format: uri-reference
                example: /api/v1/users/01a05d6f-ca97-7801-8c05-097d2e1c727a
          content:
            application/json:
              schema:
                $ref: "./schemas.yaml#/components/schemas/UserResponse"
          links:
            GetUserById:
              operationId: getUser
              parameters:
                id: "$response.body#/id"
              description: >
                The user identifier returned by this operation can be used as the id parameter of
                the getUser operation.

        "409":
          description: A user with this username already exists.
          headers:
            X-Request-Id:
              $ref: "./../common/headers.yaml#/components/headers/X-Request-Id"
          content:
            application/problem+json:
              schema:
                $ref: "./../common/schemas.yaml#/components/schemas/ErrorResponse"

        "422":
          description: Request validation failed.
          headers:
            X-Request-Id:
              $ref: "./../common/headers.yaml#/components/headers/X-Request-Id"
          content:
            application/problem+json:
              schema:
                $ref: "./../common/schemas.yaml#/components/schemas/ErrorResponse"

        "500":
          $ref: "./../common/responses.yaml#/components/responses/InternalServerError"

  /users/{id}:
    get:
      security: []
      tags:
        - users
      summary: Retrieve a user by ID.
      description: Returns the details of the specified user.
      operationId: getUser

      parameters:
        - $ref: "./../common/parameters.yaml#/components/parameters/X-Request-Id"
        - $ref: "./parameters.yaml#/components/parameters/UserId"

      responses:
        "200":
          description: User retrieved successfully.
          headers:
            X-Request-Id:
              $ref: "./../common/headers.yaml#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "./schemas.yaml#/components/schemas/UserResponse"

        "404":
          description: User not found.
          headers:
            X-Request-Id:
              $ref: "./../common/headers.yaml#/components/headers/X-Request-Id"
          content:
            application/problem+json:
              schema:
                $ref: "./../common/schemas.yaml#/components/schemas/ErrorResponse"

        "500":
          $ref: "./../common/responses.yaml#/components/responses/InternalServerError"
