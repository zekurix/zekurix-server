paths:
  /users:
    post:
      tags:
        - users
      summary: Create a new user.
      description: >-
        Creates a user and returns the created user details.
        Requires the `users:create` permission.
      operationId: createUser

      parameters:
        - $ref: "./../common/parameters.yaml#/components/parameters/X-Request-Id"

      requestBody:
        description: User creation request payload.
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/components/schemas/CreateUserRequest"
        required: true

      responses:
        "201":
          description: User created successfully.
          headers:
            X-Request-Id:
              $ref: "./../common/headers.yaml#/components/headers/X-Request-Id"
            Location:
              description: URI of the created user resource.
              schema:
                type: string
                format: uri-reference
                example: /api/v1/users/01a05d6f-ca97-7801-8c05-097d2e1c727a
          content:
            application/json:
              schema:
                $ref: "./schemas.yaml#/components/schemas/UserResponse"

          links:
            GetUserById:
              $ref: "./links.yaml#/components/links/GetUserById"
            DeleteUserById:
              $ref: "./links.yaml#/components/links/DeleteUserById"
            ListUserRolesById:
              $ref: "./links.yaml#/components/links/ListUserRolesById"
            ListUserPermissionsById:
              $ref: "./links.yaml#/components/links/ListUserPermissionsById"

        "400":
          $ref: "./../common/responses.yaml#/components/responses/BadRequest"

        "401":
          $ref: "./../common/responses.yaml#/components/responses/Unauthorized"

        "403":
          $ref: "./../common/responses.yaml#/components/responses/Forbidden"

        "409":
          $ref: "./responses.yaml#/components/responses/UserConflict"

        "413":
          $ref: "./../common/responses.yaml#/components/responses/PayloadTooLarge"

        "415":
          $ref: "./../common/responses.yaml#/components/responses/UnsupportedMediaType"

        "422":
          $ref: "./../common/responses.yaml#/components/responses/UnprocessableEntity"

        "500":
          $ref: "./../common/responses.yaml#/components/responses/InternalServerError"

        "504":
          $ref: "./../common/responses.yaml#/components/responses/GatewayTimeout"

    get:
      tags:
        - users
      summary: List users.
      description: >-
        Returns a paginated list of users.
        Requires the `users:read` permission.
      operationId: listUsers

      parameters:
        - $ref: "./../common/parameters.yaml#/components/parameters/X-Request-Id"
        - $ref: "./../common/parameters.yaml#/components/parameters/Limit"
        - $ref: "./../common/parameters.yaml#/components/parameters/Offset"

      responses:
        "200":
          description: Users retrieved successfully.
          headers:
            X-Request-Id:
              $ref: "./../common/headers.yaml#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "./schemas.yaml#/components/schemas/UsersResponse"

        "400":
          $ref: "./../common/responses.yaml#/components/responses/BadRequest"

        "401":
          $ref: "./../common/responses.yaml#/components/responses/Unauthorized"

        "403":
          $ref: "./../common/responses.yaml#/components/responses/Forbidden"

        "500":
          $ref: "./../common/responses.yaml#/components/responses/InternalServerError"

        "504":
          $ref: "./../common/responses.yaml#/components/responses/GatewayTimeout"

  /users/me:
    get:
      tags:
        - users
      summary: Retrieve the current authenticated user.
      description: Returns the details of the authenticated user.
      operationId: getCurrentUser

      parameters:
        - $ref: "./../common/parameters.yaml#/components/parameters/X-Request-Id"

      responses:
        "200":
          description: Current user retrieved successfully.
          headers:
            X-Request-Id:
              $ref: "./../common/headers.yaml#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "./schemas.yaml#/components/schemas/UserResponse"

          links:
            GetUserById:
              $ref: "./links.yaml#/components/links/GetUserById"
            DeleteUserById:
              $ref: "./links.yaml#/components/links/DeleteUserById"
            ListUserRolesById:
              $ref: "./links.yaml#/components/links/ListUserRolesById"
            ListUserPermissionsById:
              $ref: "./links.yaml#/components/links/ListUserPermissionsById"

        "400":
          $ref: "./../common/responses.yaml#/components/responses/BadRequest"

        "401":
          $ref: "./../common/responses.yaml#/components/responses/Unauthorized"

        "500":
          $ref: "./../common/responses.yaml#/components/responses/InternalServerError"

        "504":
          $ref: "./../common/responses.yaml#/components/responses/GatewayTimeout"

  /users/{id}:
    get:
      tags:
        - users
      summary: Retrieve a user.
      description: >-
        Returns the details of the specified user.
        Requires the `users:read` permission unless the authenticated user is retrieving their
        own details.
      operationId: getUser

      parameters:
        - $ref: "./../common/parameters.yaml#/components/parameters/X-Request-Id"
        - $ref: "./parameters.yaml#/components/parameters/UserId"

      responses:
        "200":
          description: User retrieved successfully.
          headers:
            X-Request-Id:
              $ref: "./../common/headers.yaml#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "./schemas.yaml#/components/schemas/UserResponse"

          links:
            DeleteUserById:
              $ref: "./links.yaml#/components/links/DeleteUserById"
            ListUserRolesById:
              $ref: "./links.yaml#/components/links/ListUserRolesById"
            ListUserPermissionsById:
              $ref: "./links.yaml#/components/links/ListUserPermissionsById"

        "400":
          $ref: "./../common/responses.yaml#/components/responses/BadRequest"

        "401":
          $ref: "./../common/responses.yaml#/components/responses/Unauthorized"

        "403":
          $ref: "./../common/responses.yaml#/components/responses/Forbidden"

        "404":
          $ref: "./responses.yaml#/components/responses/UserNotFound"

        "500":
          $ref: "./../common/responses.yaml#/components/responses/InternalServerError"

        "504":
          $ref: "./../common/responses.yaml#/components/responses/GatewayTimeout"

    delete:
      tags:
        - users
      summary: Delete a user.
      description: >-
        Removes the specified user from the system.
        Requires the `users:delete` permission unless the authenticated user is deleting
        their own account.
      operationId: deleteUser

      parameters:
        - $ref: "./../common/parameters.yaml#/components/parameters/X-Request-Id"
        - $ref: "./parameters.yaml#/components/parameters/UserId"

      responses:
        "204":
          description: User deleted successfully.
          headers:
            X-Request-Id:
              $ref: "./../common/headers.yaml#/components/headers/X-Request-Id"

        "400":
          $ref: "./../common/responses.yaml#/components/responses/BadRequest"

        "401":
          $ref: "./../common/responses.yaml#/components/responses/Unauthorized"

        "403":
          $ref: "./../common/responses.yaml#/components/responses/Forbidden"

        "404":
          $ref: "./responses.yaml#/components/responses/UserNotFound"

        "500":
          $ref: "./../common/responses.yaml#/components/responses/InternalServerError"

        "504":
          $ref: "./../common/responses.yaml#/components/responses/GatewayTimeout"

  /users/{id}/roles:
    get:
      tags:
        - users
      summary: Retrieve roles assigned to a user.
      description: >-
        Returns the roles assigned to the specified user. Requires the `roles:read`
        permission unless the authenticated user is retrieving their own roles.
      operationId: listUserRoles

      parameters:
        - $ref: "./../common/parameters.yaml#/components/parameters/X-Request-Id"
        - $ref: "./parameters.yaml#/components/parameters/UserId"

      responses:
        "200":
          description: User roles retrieved successfully.
          headers:
            X-Request-Id:
              $ref: "./../common/headers.yaml#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "./../roles/schemas.yaml#/components/schemas/RoleSummariesResponse"

        "400":
          $ref: "./../common/responses.yaml#/components/responses/BadRequest"

        "401":
          $ref: "./../common/responses.yaml#/components/responses/Unauthorized"

        "403":
          $ref: "./../common/responses.yaml#/components/responses/Forbidden"

        "404":
          $ref: "./responses.yaml#/components/responses/UserNotFound"

        "500":
          $ref: "./../common/responses.yaml#/components/responses/InternalServerError"

        "504":
          $ref: "./../common/responses.yaml#/components/responses/GatewayTimeout"

  /users/{user_id}/roles/{role_id}:
    put:
      tags:
        - users
      summary: Assign a role to a user.
      description: >-
        Assigns the specified role to the user. Requires the `roles:assign` permission.
        Repeating the request has no additional effect.
      operationId: assignRoleToUser

      parameters:
        - $ref: "./../common/parameters.yaml#/components/parameters/X-Request-Id"
        - $ref: "./parameters.yaml#/components/parameters/UserIdPath"
        - $ref: "./../roles/parameters.yaml#/components/parameters/RoleIdPath"

      responses:
        "204":
          description: Role assigned successfully, or was already assigned.
          headers:
            X-Request-Id:
              $ref: "./../common/headers.yaml#/components/headers/X-Request-Id"

        "400":
          $ref: "./../common/responses.yaml#/components/responses/BadRequest"

        "401":
          $ref: "./../common/responses.yaml#/components/responses/Unauthorized"

        "403":
          $ref: "./../common/responses.yaml#/components/responses/Forbidden"

        "404":
          $ref: "./responses.yaml#/components/responses/UserOrRoleNotFound"

        "500":
          $ref: "./../common/responses.yaml#/components/responses/InternalServerError"

        "504":
          $ref: "./../common/responses.yaml#/components/responses/GatewayTimeout"

    delete:
      tags:
        - users
      summary: Unassign a role from a user.
      description: >-
        Unassigns the specified role from the specified user. Requires the
        `roles:unassign` permission. This operation is idempotent: if both the user
        and role exist, a `204 No Content` response is returned even if the role is
        not assigned to the user.
      operationId: unassignRoleFromUser

      parameters:
        - $ref: "./../common/parameters.yaml#/components/parameters/X-Request-Id"
        - $ref: "./parameters.yaml#/components/parameters/UserIdPath"
        - $ref: "./../roles/parameters.yaml#/components/parameters/RoleIdPath"

      responses:
        "204":
          description: Role successfully unassigned from the user, or the assignment did not exist.
          headers:
            X-Request-Id:
              $ref: "./../common/headers.yaml#/components/headers/X-Request-Id"

        "400":
          $ref: "./../common/responses.yaml#/components/responses/BadRequest"

        "401":
          $ref: "./../common/responses.yaml#/components/responses/Unauthorized"

        "403":
          $ref: "./../common/responses.yaml#/components/responses/Forbidden"

        "404":
          $ref: "./responses.yaml#/components/responses/UserOrRoleNotFound"

        "500":
          $ref: "./../common/responses.yaml#/components/responses/InternalServerError"

        "504":
          $ref: "./../common/responses.yaml#/components/responses/GatewayTimeout"

  /users/{id}/permissions:
    get:
      tags:
        - users
      summary: List permissions granted to a user.
      description: >-
        Returns the effective permissions granted to the specified user through
        their assigned roles. Requires the `roles:read` permission unless the
        authenticated user is retrieving their own permissions.
      operationId: listUserPermissions

      parameters:
        - $ref: "./../common/parameters.yaml#/components/parameters/X-Request-Id"
        - $ref: "./parameters.yaml#/components/parameters/UserId"

      responses:
        "200":
          description: User permissions retrieved successfully.
          headers:
            X-Request-Id:
              $ref: "./../common/headers.yaml#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "./../permissions/schemas.yaml#/components/schemas/PermissionsResponse"

        "400":
          $ref: "./../common/responses.yaml#/components/responses/BadRequest"

        "401":
          $ref: "./../common/responses.yaml#/components/responses/Unauthorized"

        "403":
          $ref: "./../common/responses.yaml#/components/responses/Forbidden"

        "404":
          $ref: "./responses.yaml#/components/responses/UserNotFound"

        "500":
          $ref: "./../common/responses.yaml#/components/responses/InternalServerError"

        "504":
          $ref: "./../common/responses.yaml#/components/responses/GatewayTimeout"
