paths:
  /users:
    post:
      tags:
        - users
      summary: Create a new user.
      description: Creates a new user with the provided username and returns the
        created user information.
      operationId: create_user
      requestBody:
        description: The user parameters required to create the user
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "./schemas.yaml#/components/schemas/UserResponse"
        "409":
          description: A user with this username already exists
          content:
            application/json:
              schema:
                $ref: "./../common/schemas.yaml#/components/schemas/ErrorResponse"
        "422":
          description: The username is invalid. It must be between 3 and 64 characters and
            may only contain ASCII alphanumeric characters, '_' and '-'
          content:
            application/json:
              schema:
                $ref: "./../common/schemas.yaml#/components/schemas/ErrorResponse"
        "500":
          description: An unexpected internal server error occurred
          content:
            application/json:
              schema:
                $ref: "./../common/schemas.yaml#/components/schemas/ErrorResponse"
  /users/{id}:
    get:
      tags:
        - users
      summary: Retrieve a user by ID.
      description: Returns the user information for the specified user ID.
      operationId: get_user
      parameters:
        - name: id
          in: path
          description: The unique identifier of the user
          required: true
          schema:
            $ref: "./schemas.yaml#/components/schemas/UserId"
      responses:
        "200":
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: "./schemas.yaml#/components/schemas/UserResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "./../common/schemas.yaml#/components/schemas/ErrorResponse"
        "500":
          description: An unexpected internal server error occurred
          content:
            application/json:
              schema:
                $ref: "./../common/schemas.yaml#/components/schemas/ErrorResponse"
