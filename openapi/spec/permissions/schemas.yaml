components:
  schemas:
    Permission:
      description: A named capability that determines whether an operation is authorized.
      type: string
      enum:
        - roles:create
        - roles:read
        - roles:update
        - roles:delete
        - roles:assign
        - roles:unassign

    Permissions:
      description: A collection of permissions.
      type: array
      uniqueItems: true
      items:
        $ref: "#/components/schemas/Permission"
      example:
        - roles:create
        - roles:read
        - roles:delete

    PermissionsResponse:
      description: Response containing all permissions available in the API.
      type: object
      additionalProperties: false
      required:
        - permissions
      properties:
        permissions:
          allOf:
            - $ref: "#/components/schemas/Permissions"
            - type: array
              minItems: 1
      example:
        permissions:
          - roles:create
          - roles:read
          - roles:update
          - roles:delete
          - roles:assign
          - roles:unassign
