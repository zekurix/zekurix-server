components:
  schemas:
    Permission:
      description: Permission supported by the server.
      type: string
      enum:
        - roles:create
        - roles:read
        - roles:update
        - roles:delete
        - roles:assign
        - roles:unassign

    PermissionsResponse:
      description: Response containing all permissions supported by the server.
      type: object
      additionalProperties: false
      required:
        - permissions
      properties:
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Permission"
      example:
        permissions:
          - roles:create
          - roles:read
          - roles:update
          - roles:delete
          - roles:assign
          - roles:unassign
