paths:
  /permissions:
    get:
      tags:
        - permissions
      summary: List permissions.
      description: Returns all permissions supported by the server.
      operationId: getPermissions

      parameters:
        - $ref: "./../common/parameters.yaml#/components/parameters/X-Request-Id"

      responses:
        "200":
          description: Permissions retrieved successfully.
          headers:
            X-Request-Id:
              $ref: "./../common/headers.yaml#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "./schemas.yaml#/components/schemas/PermissionsResponse"

        "400":
          $ref: "./../common/responses.yaml#/components/responses/BadRequest"

        "401":
          $ref: "./../common/responses.yaml#/components/responses/Unauthorized"

        "500":
          $ref: "./../common/responses.yaml#/components/responses/InternalServerError"

        "504":
          $ref: "./../common/responses.yaml#/components/responses/GatewayTimeout"
