components:
  parameters:
    X-Request-Id:
      name: X-Request-Id
      in: header
      description: Optional request correlation identifier. If omitted, the server generates one.
      required: false
      schema:
        type: string

    Limit:
      name: limit
      in: query
      description: Maximum number of items to return per page.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

    Offset:
      name: offset
      in: query
      description: Number of items to skip for pagination.
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 4294967295
        default: 0
