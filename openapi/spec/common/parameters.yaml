components:
  parameters:
    X-Request-Id:
      name: X-Request-Id
      in: header
      description: Optional request correlation identifier. If omitted, the server generates one.
      required: false
      schema:
        type: string

    Limit:
      name: limit
      in: query
      description: Maximum number of items to return per page.
      required: false
      schema:
        $ref: "./schemas.yaml#/components/schemas/Limit"

    Offset:
      name: offset
      in: query
      description: Number of items to skip for pagination.
      required: false
      schema:
        $ref: "./schemas.yaml#/components/schemas/Offset"
