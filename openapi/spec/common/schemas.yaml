components:
  schemas:
    ErrorResponse:
      description: RFC 9457 problem details response.
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail

      properties:
        type:
          type: string
          format: uri
          description: Problem type identifier.
          example: https://api.zekurix.com/problems/internal-server-error

        title:
          type: string
          description: Short human-readable summary of the problem.
          example: Internal Server Error

        status:
          type: integer
          description: HTTP status code.
          example: 500

        detail:
          type: string
          description: Human-readable explanation of the problem.
          example: An unexpected internal server error occurred.

        instance:
          type: string
          format: uri
          description: URI identifying the specific occurrence of the problem.

      example:
        type: https://api.zekurix.com/problems/internal-server-error
        title: Internal Server Error
        status: 500
        detail: An unexpected internal server error occurred.

    Limit:
      description: Maximum number of items to return per page.
      type: integer
      minimum: 1
      maximum: 100
      default: 50

    Offset:
      description: Number of items to skip for pagination. Offset is zero-based.
      type: integer
      minimum: 0
      maximum: 4294967295
      default: 0
    
    Total:
      description: >-
        The total number of items matching the request filters,
        before applying `limit` and `offset`.
      type: integer
      format: int64
      minimum: 0
      example: 75

    Pagination:
      description: >-
        Pagination metadata for the requested page.
        `limit` and `offset` contain the values applied to the request.
        `offset` is zero-based. `total` is the total number of items
        matching the request filters before applying `limit` and `offset`.
        When `offset` is greater than or equal to `total`, the returned
        item collection is empty.
      type: object
      additionalProperties: false
      required:
        - limit
        - offset
        - total
      properties:
        limit:
          $ref: "./schemas.yaml#/components/schemas/Limit"
        offset:
          $ref: "./schemas.yaml#/components/schemas/Offset"
        total:
          $ref: "./schemas.yaml#/components/schemas/Total"
      example:
        limit: 50
        offset: 0
        total: 75
