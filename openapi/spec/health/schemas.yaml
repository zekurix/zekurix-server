components:
  schemas:
    HealthResponse:
      type: object
      description: Response returned by the health check endpoint.
      additionalProperties: false
      required:
        - status
        - version
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - unhealthy
          description: |
            Current health status of the application:
            - `ok`: All components are operating normally.
            - `degraded`: One or more components are experiencing issues, but the application remains operational.
            - `unhealthy`: One or more critical components prevent the application from operating correctly.
          example: ok
        version:
          type: string
          description: Current application version following Semantic Versioning (SemVer).
          example: 1.0.0
