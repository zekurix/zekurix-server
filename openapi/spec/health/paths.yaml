paths:
  /health:
    get:
      security: []
      tags:
        - health
      summary: Get application health status.
      description: Returns the current application health status and version.
      operationId: getHealth

      responses:
        "200":
          description: Current application health status and version.
          content:
            application/json:
              schema:
                $ref: "./schemas.yaml#/components/schemas/HealthResponse"
